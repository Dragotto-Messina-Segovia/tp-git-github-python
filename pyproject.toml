[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-manager"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dragotto-Messina-Segovia" }]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1",
  "pylint>=3",
  "pylint-pytest>=1.1",
]

[tool.setuptools]
py-modules = ["app", "task_manager"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-q",
  "--strict-markers",
  "--strict-config",
  "--cov=task_manager",
  "--cov=app",
  "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["task_manager", "app"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = [
  'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pylint.main]
load-plugins = ["pylint_pytest"]

[tool.pylint.messages_control]
disable = [
  "C0114", # missing-module-docstring
  "C0115", # missing-class-docstring
  "C0116", # missing-function-docstring
  "R0903", # too-few-public-methods
]